name: 🫣 Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VARIANT: assembleFdroidFullDebug
    steps:
    - name: 🥏 Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: ☕️ JDKv17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: ⚡️ +x gradlew
      run: chmod +x gradlew

    - name: 🎪 Setup Configuration
      run: |
        mkdir -p app/src/debug
        if [ -n "${GSCV_TEST_JSON}" ]; then
          echo "${GSCV_TEST_JSON}" > app/src/debug/google-services.json
          echo "VARIANT=assembleWebsiteFullDebug" >> "$GITHUB_ENV"
        else
          echo "Building open-source F-Droid flavor without proprietary trackers"
          echo "VARIANT=assembleFdroidFullDebug" >> "$GITHUB_ENV"
        fi
      env:
        GSCV_TEST_JSON: ${{ secrets.GOOGLE_SERVICES_TEST_JSON }}

    - name: 🚂 Assemble APK
      run: |
        ./gradlew ${VARIANT} --no-daemon --stacktrace -x test -x lint

    - name: 📦 Prepare APK Artifact
      if: always()
      run: |
        mkdir -p dist
        find app/build/outputs/apk/ -name "*arm64*.apk" -exec cp {} dist/ \; 2>/dev/null || true
        echo "Collected Single ARM64 APK:"
        ls -la dist/

    - name: 🚀 Upload Installable APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: RethinkDNS-Modded-Debug-APK
        path: dist/*.apk
        if-no-files-found: ignore
